<title>เทมเพลตใบงานแม่แบบ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* ============================================================
   WORKSHEET MASTER TEMPLATE — VIP English Hub  v1
   ใบงาน A4 พิมพ์ได้จริง ประหยัดหมึก ใช้ตัวละครจาก animal-sprite.svg

   วิธีใช้
   1. ก็อปไฟล์นี้ตั้งชื่อตามกฎ เช่น G1-U05-VOC-Animals-L1-BW-v1.html
   2. แก้ตรง CONTENT START ถึง CONTENT END เท่านั้น ห้ามแตะส่วนอื่น
   3. แก้ชื่อแบรนด์ที่ตัวแปร --brand-name ในบล็อก BRAND ด้านล่าง
   4. เปิดในเบราว์เซอร์ กด Ctrl+P เลือก A4 แล้ว Save as PDF
      ตั้งค่า Margins เป็น Default และปิด Headers and footers

   ทำไมถึงใช้ HTML ไม่ใช่ Canva
   - แก้ 300 ใบพร้อมกันได้ด้วยการแก้ไฟล์เดียว
   - ตัวละครเป็นเส้นขาวดำอัตโนมัติ ไม่ต้องเจนภาพใหม่ ไม่มีค่าลิขสิทธิ์
   - ไฟล์เล็ก เปิดได้ทุกเครื่อง ไม่ต้องมีบัญชีอะไรเลย
   ============================================================ */

/* ---------- BRAND: แก้ 2 บรรทัดนี้ให้เป็นของคุณ ---------- */
:root{
  --brand-name:"คลังสื่อภาษาอังกฤษ VIP";
  --brand-note:"ใช้ได้ในห้องเรียนของผู้ซื้อเท่านั้น · ห้ามแชร์ต่อ ห้ามขายซ้ำ";
}

/* ---------- หน้ากระดาษ ---------- */
@page{ size:A4; margin:12mm 12mm 10mm; }
*{box-sizing:border-box}
body{
  margin:0;background:#EFEFEF;color:#111;
  font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:12pt;line-height:1.7;
}
.en{font-family:'Fredoka','Sarabun',sans-serif}

.sheet{
  width:186mm;min-height:273mm;margin:8mm auto;padding:0;background:#fff;
  display:flex;flex-direction:column;
  box-shadow:0 2px 12px rgba(0,0,0,.18);
}
.sheet + .sheet{margin-top:10mm}

/* ---------- หัวกระดาษ ---------- */
.head{display:flex;align-items:flex-end;gap:6mm;border-bottom:2.5pt solid #111;padding-bottom:2.5mm}
.head .ttl{flex:1;min-width:0}
.head .unit{font-size:9pt;letter-spacing:.06em;text-transform:uppercase;color:#555}
.head h1{margin:0;font-family:'Fredoka',sans-serif;font-size:20pt;font-weight:700;line-height:1.15}
.head .lv{
  border:1.6pt solid #111;border-radius:3mm;padding:1mm 3mm;font-family:'Fredoka',sans-serif;
  font-size:11pt;font-weight:600;white-space:nowrap;
}
.namebar{
  display:flex;gap:5mm;padding:3mm 0;border-bottom:1pt solid #111;font-size:11pt;
}
.namebar .f{display:flex;align-items:baseline;gap:2mm;flex:1}
.namebar .f i{font-style:normal;color:#333;white-space:nowrap}
.namebar .f u{flex:1;text-decoration:none;border-bottom:1pt dotted #111;min-height:1.2em}

/* ---------- คำสั่งโจทย์ ---------- */
.task{margin-top:4mm;break-inside:avoid}
.task > .cmd{display:flex;gap:2.5mm;align-items:baseline}
.task .no{
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:12pt;
  border:1.6pt solid #111;border-radius:50%;width:7mm;height:7mm;
  display:inline-grid;place-items:center;flex:none;line-height:1;
}
.task .cmd-en{font-family:'Fredoka',sans-serif;font-size:13pt;font-weight:600}
.task .cmd-th{font-size:10.5pt;color:#333;margin:.5mm 0 0 9.5mm}

/* ---------- ตัวละครโหมดประหยัดหมึก ---------- */
.art{width:26mm;display:block}
.art svg{display:block;width:100%;height:auto}
/* โหมดประหยัดหมึก: ส่งค่าผ่าน custom property เพราะ selector ธรรมดา
   เข้าไปในเงาของ <use> ไม่ได้ แต่ custom property สืบทอดเข้าไปได้ */
.line-art{--art-fill:#fff;--ink:#111}

/* ---------- ชิ้นส่วนที่ใช้ซ้ำในใบงาน ---------- */
.matchrow{display:flex;justify-content:space-between;gap:8mm;margin-top:4mm}
.matchrow .art{width:16mm}
.matchcol{display:flex;flex-direction:column;gap:3mm;flex:none}
.mitem{display:flex;align-items:center;gap:3mm}
.dot{width:3.2mm;height:3.2mm;border:1.4pt solid #111;border-radius:50%;flex:none}
.wordbox{
  border:1.6pt solid #111;border-radius:2.5mm;padding:1.5mm 5mm;
  font-family:'Fredoka',sans-serif;font-size:15pt;font-weight:600;min-width:34mm;text-align:center;
}
.trace{
  font-family:'Fredoka',sans-serif;font-size:22pt;font-weight:500;
  color:#C9C9C9;letter-spacing:.1em;
}
.pickrow{display:flex;align-items:center;gap:5mm;margin-top:3mm;break-inside:avoid}
.pickrow .art{width:16mm}
.picks{display:flex;gap:4mm;flex-wrap:wrap}
.pick{
  border:1.6pt solid #111;border-radius:2.5mm;padding:1mm 4mm;
  font-family:'Fredoka',sans-serif;font-size:14pt;font-weight:600;
}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:4mm}
.cell{border:1.4pt solid #111;border-radius:3mm;padding:2mm;text-align:center;break-inside:avoid}
.cell .lbl{font-family:'Fredoka',sans-serif;font-size:13pt;font-weight:600;margin-top:2mm}
.cell .art{width:100%;max-width:21mm;margin:0 auto}
.writeline{border-bottom:1pt dotted #111;min-height:9mm;margin-top:3mm}

/* ---------- ท้ายกระดาษ ---------- */
.foot{
  margin-top:auto;padding-top:3mm;border-top:1pt solid #999;
  display:flex;justify-content:space-between;gap:4mm;font-size:8pt;color:#555;
}
.foot .code{font-family:'Fredoka',sans-serif;letter-spacing:.04em}
.foot .brand::before{content:var(--brand-name)}
.foot .terms::before{content:var(--brand-note)}

/* ---------- เฉลย ---------- */
.keytag{
  display:inline-block;border:1.6pt solid #111;background:#111;color:#fff;
  border-radius:2mm;padding:.5mm 3mm;font-family:'Fredoka',sans-serif;font-size:10pt;
}
.ans{color:#111;font-weight:600}
.ans-line{stroke:#111;stroke-width:1.6;stroke-dasharray:0}
body:not(.show-key) .sheet.key{display:none}

/* ---------- แถบควบคุมบนจอ ไม่ติดไปกับกระดาษ ---------- */
.bar{
  position:sticky;top:0;z-index:9;background:#111;color:#fff;
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  padding:.7rem 1rem;font-size:.9rem;
}
.bar b{font-weight:600}
.bar .sp{flex:1}
.bar button{
  font-family:inherit;font-size:.88rem;border:1.5px solid #fff;background:transparent;color:#fff;
  border-radius:6px;padding:.35rem .9rem;cursor:pointer;
}
.bar button[aria-pressed="true"]{background:#fff;color:#111;font-weight:600}
.bar button:focus-visible{outline:3px solid #FFC93C;outline-offset:2px}

@media print{
  body{background:#fff}
  .bar{display:none}
  /* ขึ้นหน้าใหม่ "ก่อน" แผ่นถัดไป ไม่ใช่ "หลัง" แผ่นก่อนหน้า
     ไม่งั้นเวลาซ่อนเฉลย จะได้หน้าเปล่าติดมาด้วยหนึ่งหน้า */
  .sheet{width:auto;min-height:0;margin:0;box-shadow:none}
  .sheet + .sheet{page-break-before:always}
}
</style>

<!-- SPRITE: วางไฟล์ products/_shared/animal-sprite.svg ทั้งก้อนตรงนี้ -->
__SPRITE__

<div class="bar">
  <b>ใบงาน</b>
  <span id="bar-title">เทมเพลตแม่แบบ</span>
  <span class="sp"></span>
  <button type="button" id="t-key" aria-pressed="false">แสดงเฉลย</button>
  <button type="button" id="t-print">พิมพ์ / บันทึกเป็น PDF</button>
</div>

<!-- ================= CONTENT START ================= -->
__CONTENT__
<!-- ================= CONTENT END ================= -->

<script>
(function(){
  var body = document.body;
  var k = document.getElementById("t-key");
  k.addEventListener("click", function(){
    var on = body.classList.toggle("show-key");
    k.setAttribute("aria-pressed", String(on));
    k.textContent = on ? "ซ่อนเฉลย" : "แสดงเฉลย";
  });
  document.getElementById("t-print").addEventListener("click", function(){ window.print(); });
})();
</script>
